<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동작 따라하기 미션</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Jua',sans-serif;background:#06060f;color:#fff;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #skel{position:absolute;inset:0;z-index:2;width:100%;height:100%;transform:scaleX(-1);}
  /* HUD */
  .hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 18px;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);}
  .score{background:rgba(20,12,50,.8);border:3px solid #34e3e3;border-radius:14px;padding:8px 14px;
    font-family:'Press Start 2P';font-size:clamp(16px,4vw,24px);color:#34e3e3;}
  /* 미션 카드 */
  .mission{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
    background:rgba(20,12,50,.82);border:3px solid #ffd23f;border-radius:18px;padding:12px 22px;
    text-align:center;min-width:240px;}
  .mission .ttl{font-size:14px;color:#ffd23f;}
  .mission .name{font-family:'Black Han Sans';font-size:clamp(26px,7vw,40px);color:#fff;line-height:1.1;}
  .mission .fig{font-size:46px;line-height:1;margin-top:2px;}
  .bar{height:14px;border-radius:8px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ed94a,#ffd23f);transition:width .08s linear;}
  .flash{position:absolute;inset:0;z-index:7;background:#5ed94a;opacity:0;pointer-events:none;}
  .flash.go{animation:fl .5s ease;}
  @keyframes fl{0%{opacity:.5;}100%{opacity:0;}}
  .cheer{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:8;
    font-family:'Black Han Sans';font-size:60px;color:#fff;text-shadow:0 0 20px #5ed94a,4px 4px 0 #000;
    opacity:0;pointer-events:none;}
  .cheer.go{animation:ch 1s ease;}
  @keyframes ch{20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}100%{opacity:0;transform:translate(-50%,-60%);}}
  /* panel */
  .panel{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;text-align:center;padding:26px;background:rgba(6,6,15,.92);}
  .panel.hide{display:none;}
  h1{font-family:'Black Han Sans';font-size:clamp(30px,8vw,48px);color:#5ed94a;
    text-shadow:3px 3px 0 #ff3d8b,6px 6px 0 rgba(0,0,0,.4);line-height:1.1;}
  .desc{font-size:16px;color:#cdbdfc;max-width:440px;line-height:1.6;}
  .startbtn{border:none;border-radius:16px;padding:16px 30px;font-family:'Jua';font-size:22px;
    background:#ffd23f;color:#1d1442;cursor:pointer;box-shadow:0 5px 0 #b58900;}
  .startbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b58900;}
  .loader{font-size:16px;color:#ffd23f;}
  .err{font-size:15px;color:#ff7676;max-width:440px;line-height:1.5;}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="skel"></canvas>
  <div class="hud"><div></div><div class="score">★ <span id="score">0</span></div></div>

  <div class="mission" id="mission" style="display:none">
    <div class="ttl">이 동작을 따라 해요!</div>
    <div class="name" id="mName">만세</div>
    <div class="fig" id="mFig">🙆</div>
    <div class="bar"><i id="mBar"></i></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="cheer" id="cheer">성공!</div>

  <div class="panel" id="panel">
    <h1>동작 따라하기<br>미션</h1>
    <p class="desc">AI가 보여주는 동작을 몸으로 따라 하면 카메라가 알아봐요. 자세를 <b>잠깐 유지</b>하면 성공! 온몸이 보이게 한두 걸음 물러서 주세요.</p>
    <button class="startbtn" id="startBtn">카메라 켜고 시작</button>
    <p class="loader" id="loader" style="display:none">AI 불러오는 중...</p>
    <p class="err" id="err" style="display:none"></p>
  </div>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

const $ = id => document.getElementById(id);
const stage=$('stage'), video=$('video'), skel=$('skel'), sctx=skel.getContext('2d');
const scoreEl=$('score'), mission=$('mission'), mName=$('mName'), mFig=$('mFig'), mBar=$('mBar');
const flash=$('flash'), cheer=$('cheer'), panel=$('panel'), startBtn=$('startBtn'), loader=$('loader'), err=$('err');

let pose=null, running=false, lastVideoTime=-1, lastT=0;
let score=0, target=null, hold=0, locked=false;
const HOLD_NEED=0.9; // 초

let actx=null;
function tone(f,d,t,v,s){const a=actx;if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(s,a.currentTime+d);
  g.gain.setValueAtTime(v||.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}
const chimeS=()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.2),i*80));
const tickS=()=>tone(660,.05,'square',.1);

/* ---- 동작 정의 (좌우 구분 없는 대칭 동작) ---- */
const POSES=[
  {name:'만세',        fig:'🙌', test:(p)=> aboveShoulder(p,15)&&aboveShoulder(p,16)},
  {name:'양팔 벌리기 (T)',fig:'🧍', test:(p)=> tPose(p)},
  {name:'차렷',        fig:'🧍', test:(p)=> belowShoulder(p,15)&&belowShoulder(p,16)&&!tPose(p)},
  {name:'한 팔만 위로',  fig:'🙋', test:(p)=> aboveShoulder(p,15)!==aboveShoulder(p,16)},
];
function shY(p){return (p[11].y+p[12].y)/2;}
function shCx(p){return (p[11].x+p[12].x)/2;}
function aboveShoulder(p,w){return p[w].y < shY(p)-0.05;}
function belowShoulder(p,w){return p[w].y > shY(p)+0.12;}
function tPose(p){
  const near15=Math.abs(p[15].y-shY(p))<0.13, near16=Math.abs(p[16].y-shY(p))<0.13;
  const wide15=Math.abs(p[15].x-shCx(p))>0.17, wide16=Math.abs(p[16].x-shCx(p))>0.17;
  return near15&&near16&&wide15&&wide16;
}

function nextTarget(){
  let t; do{ t=POSES[Math.floor(Math.random()*POSES.length)]; }while(t===target);
  target=t; hold=0; locked=false;
  mName.textContent=t.name; mFig.textContent=t.fig; mBar.style.width='0%';
}

/* ---- skeleton draw ---- */
const LINES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawSkel(p){
  skel.width=stage.clientWidth;skel.height=stage.clientHeight;
  const W=skel.width,H=skel.height;sctx.clearRect(0,0,W,H);
  sctx.strokeStyle='#34e3e3';sctx.lineWidth=5;sctx.lineCap='round';
  LINES.forEach(([a,b])=>{if(!p[a]||!p[b])return;sctx.beginPath();
    sctx.moveTo(p[a].x*W,p[a].y*H);sctx.lineTo(p[b].x*W,p[b].y*H);sctx.stroke();});
  sctx.fillStyle='#ffd23f';
  [11,12,13,14,15,16].forEach(i=>{if(!p[i])return;sctx.beginPath();sctx.arc(p[i].x*W,p[i].y*H,8,0,7);sctx.fill();});
}

function loop(){
  if(!running)return;
  const now=performance.now();
  if(pose && video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    let res=null;try{res=pose.detectForVideo(video,now);}catch(e){}
    const dt=lastT?Math.min((now-lastT)/1000,.06):0;lastT=now;
    if(res&&res.landmarks&&res.landmarks.length){
      const p=res.landmarks[0];drawSkel(p);
      if(!locked && target && target.test(p)){
        hold+=dt; mBar.style.width=Math.min(100,hold/HOLD_NEED*100)+'%';
        if(Math.floor(hold*8)!==Math.floor((hold-dt)*8))tickS();
        if(hold>=HOLD_NEED){
          locked=true;score++;scoreEl.textContent=score;chimeS();
          flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
          cheer.classList.remove('go');void cheer.offsetWidth;cheer.classList.add('go');
          setTimeout(()=>{if(running)nextTarget();},900);
        }
      } else if(!locked){ hold=Math.max(0,hold-dt*1.5); mBar.style.width=Math.min(100,hold/HOLD_NEED*100)+'%'; }
    } else { sctx.clearRect(0,0,skel.width,skel.height); }
  }
  requestAnimationFrame(loop);
}

async function start(){
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    startBtn.style.display='none';loader.style.display='block';
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720}});
    video.srcObject=stream;await video.play();
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
    pose=await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
      runningMode:"VIDEO",numPoses:1});
    panel.classList.add('hide');mission.style.display='block';
    running=true;nextTarget();requestAnimationFrame(loop);
  }catch(e){
    loader.style.display='none';err.style.display='block';
    err.textContent='카메라 또는 AI를 불러오지 못했어요. https 주소에서 열고 카메라 권한을 허용했는지 확인해 주세요. ('+e.message+')';
    startBtn.style.display='inline-block';
  }
}
startBtn.addEventListener('click',start);
</script>
<a href="index.html" aria-label="메뉴로" style="position:fixed;left:12px;bottom:12px;z-index:9;width:48px;height:48px;border-radius:12px;background:rgba(20,12,50,.82);border:3px solid #fff;display:grid;place-items:center;font-size:22px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.4);">🏠</a>
</body>
</html>
