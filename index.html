<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>피지컬 AI 게임존</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Jua',sans-serif;min-height:100dvh;color:#fff;
    background:radial-gradient(120% 90% at 50% 0%,#3a1d63,#1b1030 60%,#0c0820);
    display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px;}
  .badge{font-family:'Press Start 2P';font-size:11px;color:#34e3e3;border:2px solid #34e3e3;
    border-radius:999px;padding:7px 14px;letter-spacing:1px;}
  h1{font-family:'Black Han Sans';font-size:clamp(34px,9vw,58px);line-height:1.05;text-align:center;
    margin:14px 0 4px;color:#ffd23f;text-shadow:3px 3px 0 #ff3d8b,6px 6px 0 rgba(0,0,0,.4);}
  h1 .b{color:#5ed94a;}
  .sub{color:#cdbdfc;font-size:16px;margin-bottom:26px;text-align:center;}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;width:100%;max-width:920px;}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
    text-decoration:none;color:#fff;border-radius:22px;padding:26px 18px 24px;
    background:rgba(29,20,66,.85);border:3px solid #3a2a6e;
    box-shadow:0 8px 0 rgba(0,0,0,.4);transition:transform .1s,border-color .1s;}
  .card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.4);}
  .card:hover{border-color:#ffd23f;}
  .ico{font-size:70px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));}
  .name{font-family:'Black Han Sans';font-size:24px;line-height:1.15;}
  .tag{font-family:'Press Start 2P';font-size:9px;padding:3px 9px;border-radius:999px;color:#1d1442;}
  .card.c1 .tag{background:#5ed94a;} .card.c1{border-color:#2f7a27;}
  .card.c3 .tag{background:#34e3e3;} .card.c3{border-color:#1c8a8a;}
  .card.c4 .tag{background:#ff3d8b;} .card.c4{border-color:#9c1f55;}
  .card .desc{font-size:15px;color:#cdbdfc;line-height:1.45;}
  .note{margin-top:28px;max-width:620px;text-align:center;font-size:14px;color:#9c8fd0;line-height:1.7;}
  .note b{color:#ffd23f;}
</style>
</head>
<body>
  <span class="badge">PHYSICAL AI</span>
  <h1>몸으로 노는<br><span class="b">AI 게임존</span></h1>
  <p class="sub">직업교육박람회 · 카메라 앞에서 몸과 손으로 즐겨요</p>

  <div class="grid">
    <a class="card c1" href="hand-bubble.html">
      <div class="ico">🫧</div>
      <span class="tag">손 인식</span>
      <div class="name">손으로 터뜨리는<br>보글보글</div>
      <div class="desc">집게손가락으로 정답 거품을 톡! 터뜨려요</div>
    </a>
    <a class="card c3" href="pose-mimic.html">
      <div class="ico">🙌</div>
      <span class="tag">자세 인식</span>
      <div class="name">동작 따라하기<br>미션</div>
      <div class="desc">AI가 보여주는 동작을 몸으로 따라 해요</div>
    </a>
    <a class="card c4" href="catch-dodge.html">
      <div class="ico">🧺</div>
      <span class="tag">자세 인식</span>
      <div class="name">몸으로<br>받기·피하기</div>
      <div class="desc">좋은 물건은 받고 위험한 건 피해요!</div>
    </a>
  </div>

  <p class="note">처음 한 번은 <b>카메라 허용</b>을 눌러야 하고, AI를 불러오는 데 몇 초 걸려요.
  자세 게임(가운데·오른쪽)은 <b>온몸이 보이게</b> 한두 걸음 물러서 주세요.</p>
</body>
</html>
