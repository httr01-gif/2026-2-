<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>몸으로 받기·피하기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:'Jua',sans-serif;background:#06060f;color:#fff;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #layer{position:absolute;inset:0;z-index:2;}
  .hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;
    align-items:center;padding:14px 18px;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);}
  .chip{background:rgba(20,12,50,.8);border-radius:14px;padding:8px 14px;font-family:'Press Start 2P';
    font-size:clamp(15px,3.6vw,22px);}
  .chip.score{border:3px solid #34e3e3;color:#34e3e3;}
  .chip.time{border:3px solid #ffd23f;color:#ffd23f;}
  .chip.time.warn{color:#ff5252;border-color:#ff5252;animation:blink .5s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35;}}
  .item{position:absolute;z-index:3;font-size:50px;line-height:1;will-change:transform;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));}
  .basket{position:absolute;z-index:4;bottom:18px;font-size:64px;margin-left:-32px;
    transition:transform .05s linear;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));}
  .pop{position:absolute;z-index:6;font-family:'Press Start 2P';font-size:20px;pointer-events:none;
    text-shadow:0 2px 0 #000;animation:pp .7s ease-out forwards;}
  @keyframes pp{20%{opacity:1;transform:translateY(-10px) scale(1.1);}100%{opacity:0;transform:translateY(-46px);}}
  .redflash{position:absolute;inset:0;z-index:7;background:#ff2d2d;opacity:0;pointer-events:none;}
  .redflash.go{animation:rf .4s ease;}
  @keyframes rf{0%{opacity:.4;}100%{opacity:0;}}
  .panel{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:26px;background:rgba(6,6,15,.92);}
  .panel.hide{display:none;}
  h1{font-family:'Black Han Sans';font-size:clamp(28px,7.5vw,46px);color:#5ed94a;
    text-shadow:3px 3px 0 #ff3d8b,6px 6px 0 rgba(0,0,0,.4);line-height:1.1;}
  .desc{font-size:16px;color:#cdbdfc;max-width:440px;line-height:1.6;}
  .legend{display:flex;gap:20px;font-size:18px;}
  .startbtn{border:none;border-radius:16px;padding:16px 30px;font-family:'Jua';font-size:22px;
    background:#ffd23f;color:#1d1442;cursor:pointer;box-shadow:0 5px 0 #b58900;}
  .startbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b58900;}
  .loader{font-size:16px;color:#ffd23f;}.err{font-size:15px;color:#ff7676;max-width:440px;line-height:1.5;}
  .result-title{font-family:'Black Han Sans';font-size:clamp(30px,9vw,50px);color:#ff3d8b;text-shadow:3px 3px 0 #000;}
  .big{font-family:'Press Start 2P';font-size:30px;color:#ffd23f;}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="layer">
    <div class="basket" id="basket">🧺</div>
  </div>
  <div class="hud">
    <div class="chip score">★ <span id="score">0</span></div>
    <div class="chip time" id="timeChip">⏱ <span id="time">45</span></div>
  </div>
  <div class="redflash" id="redflash"></div>

  <div class="panel" id="panel">
    <h1>몸으로<br>받기·피하기</h1>
    <p class="desc">몸을 <b>좌우로</b> 움직여 바구니를 옮겨요. 좋은 물건은 받고, 위험한 건 피하세요! 온몸이 보이게 한두 걸음 물러서 주세요.</p>
    <div class="legend"><span>받기 🔧🔨📚☕</span><span>피하기 💣⚠️</span></div>
    <button class="startbtn" id="startBtn">카메라 켜고 시작</button>
    <p class="loader" id="loader" style="display:none">AI 불러오는 중...</p>
    <p class="err" id="err" style="display:none"></p>
  </div>

  <div class="panel hide" id="result">
    <div class="result-title">시간 끝!</div>
    <div>점수</div><div class="big" id="finalScore">0</div>
    <button class="startbtn" id="againBtn">다시 하기</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

const $ = id => document.getElementById(id);
const stage=$('stage'), layer=$('layer'), video=$('video'), basket=$('basket');
const scoreEl=$('score'), timeEl=$('time'), timeChip=$('timeChip'), redflash=$('redflash');
const panel=$('panel'), result=$('result'), finalScore=$('finalScore');
const startBtn=$('startBtn'), againBtn=$('againBtn'), loader=$('loader'), err=$('err');

const GAME_TIME=45;
const GOOD=['🔧','🔨','📚','☕','✏️','🧰'], BAD=['💣','⚠️'];
let pose=null, running=false, lastVideoTime=-1, lastT=0, spawnT=0, timerId=null;
let score=0, timeLeft=GAME_TIME, basketX=0, items=[];
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

let actx=null;
function tone(f,d,t,v,s){const a=actx;if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(s,a.currentTime+d);
  g.gain.setValueAtTime(v||.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}
const goodS=()=>tone(700,.12,'triangle',.2,950);
const badS=()=>tone(160,.2,'sine',.16,90);
const beepS=()=>tone(880,.1,'square',.16);
const overS=()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.2),i*170));

function spawn(){
  const bad=Math.random()<0.32;
  const el=document.createElement('div');el.className='item';
  el.textContent= bad? BAD[ri(0,BAD.length-1)] : GOOD[ri(0,GOOD.length-1)];
  const W=stage.clientWidth;
  const x=ri(30,W-30);
  const it={bad,x,y:-40,vy:ri(150,230)+(GAME_TIME-timeLeft)*2,el};
  el.style.transform='translate('+x+'px,-40px)';layer.appendChild(el);items.push(it);
}
function popText(x,y,txt,color){const p=document.createElement('div');p.className='pop';p.textContent=txt;
  p.style.color=color;p.style.left=x+'px';p.style.top=y+'px';layer.appendChild(p);setTimeout(()=>p.remove(),720);}

function loop(){
  if(!running)return;
  const now=performance.now();
  // pose → basket x
  if(pose && video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    let res=null;try{res=pose.detectForVideo(video,now);}catch(e){}
    if(res&&res.landmarks&&res.landmarks.length){
      const p=res.landmarks[0];const cx=(p[11].x+p[12].x)/2;
      basketX=(1-cx)*stage.clientWidth;   // 거울 보정
    }
  }
  const W=stage.clientWidth,H=stage.clientHeight;
  basketX=Math.max(34,Math.min(W-34,basketX));
  basket.style.transform='translateX('+basketX+'px)';
  const basketY=H-50;

  const dt=lastT?Math.min((now-lastT)/1000,.05):0;lastT=now;
  // spawn
  spawnT-=dt; if(spawnT<=0){spawn();spawnT=Math.max(0.45,1.1-(GAME_TIME-timeLeft)*0.02);}
  // move items
  for(let i=items.length-1;i>=0;i--){const it=items[i];
    it.y+=it.vy*dt;it.el.style.transform='translate('+it.x+'px,'+it.y+'px)';
    // catch zone
    if(it.y>basketY-30 && it.y<basketY+40 && Math.abs(it.x-basketX)<60){
      if(it.bad){score=Math.max(0,score-5);badS();redflash.classList.remove('go');void redflash.offsetWidth;redflash.classList.add('go');popText(it.x,it.y,'-5','#ff6b6b');}
      else{score+=10;goodS();popText(it.x,it.y,'+10','#ffd23f');}
      scoreEl.textContent=score;it.el.remove();items.splice(i,1);continue;
    }
    if(it.y>H+50){it.el.remove();items.splice(i,1);}
  }
  requestAnimationFrame(loop);
}
function tick(){timeLeft--;timeEl.textContent=timeLeft;
  if(timeLeft<=10)timeChip.classList.add('warn');
  if(timeLeft<=5&&timeLeft>0)beepS();
  if(timeLeft<=0)endGame();}

function endGame(){running=false;clearInterval(timerId);overS();
  items.forEach(it=>it.el.remove());items=[];
  finalScore.textContent=score;result.classList.remove('hide');}

function begin(){
  result.classList.add('hide');
  score=0;timeLeft=GAME_TIME;items.forEach(it=>it.el.remove());items=[];spawnT=0;
  scoreEl.textContent=0;timeEl.textContent=timeLeft;timeChip.classList.remove('warn');
  running=true;clearInterval(timerId);timerId=setInterval(tick,1000);
  requestAnimationFrame(loop);
}

async function start(){
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    startBtn.style.display='none';loader.style.display='block';
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720}});
    video.srcObject=stream;await video.play();
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
    pose=await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
      runningMode:"VIDEO",numPoses:1});
    basketX=stage.clientWidth/2;
    panel.classList.add('hide');begin();
  }catch(e){
    loader.style.display='none';err.style.display='block';
    err.textContent='카메라 또는 AI를 불러오지 못했어요. https 주소에서 열고 카메라 권한을 허용했는지 확인해 주세요. ('+e.message+')';
    startBtn.style.display='inline-block';
  }
}
startBtn.addEventListener('click',start);
againBtn.addEventListener('click',begin);
</script>
<a href="index.html" aria-label="메뉴로" style="position:fixed;left:12px;bottom:12px;z-index:9;width:48px;height:48px;border-radius:12px;background:rgba(20,12,50,.82);border:3px solid #fff;display:grid;place-items:center;font-size:22px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.4);">🏠</a>
</body>
</html>
